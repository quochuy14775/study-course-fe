<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Square background with rounded corners -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#grad1)"/>

  <!-- Shine effect -->
  <rect x="20" y="20" width="160" height="80" rx="40" fill="white" opacity="0.1"/>

  <!-- EH lettering inside -->
  <text x="100" y="135" font-size="72" font-weight="900" font-family="Arial, sans-serif" text-anchor="middle" fill="white" opacity="0.15">EH</text>

  <!-- Modern book icon with lines (knowledge/learning concept) -->
  <g transform="translate(55, 60)">
    <!-- Book main body -->
    <path d="M 10 10 L 10 70 Q 15 75 25 75 L 25 10 Z" fill="white" opacity="0.95"/>
    <path d="M 26 10 L 26 75 Q 36 75 40 70 L 40 10 Z" fill="white" opacity="0.9"/>

    <!-- Book spine -->
    <rect x="9" y="10" width="2" height="65" fill="url(#grad2)" opacity="0.6"/>

    <!-- Reading lines (pages content) -->
    <line x1="15" y1="25" x2="23" y2="25" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="15" y1="35" x2="23" y2="35" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="15" y1="45" x2="23" y2="45" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <line x1="30" y1="25" x2="38" y2="25" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="30" y1="35" x2="38" y2="35" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="30" y1="45" x2="38" y2="45" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Bookmark -->
    <rect x="35" y="8" width="4" height="45" rx="2" fill="#fbbf24" opacity="0.9"/>
  </g>
</svg>
