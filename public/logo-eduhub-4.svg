<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Hexagon background (modern education vibe) -->
  <polygon points="100,10 170,50 170,130 100,170 30,130 30,50" fill="url(#grad4)"/>

  <!-- Shine effect -->
  <polygon points="100,10 170,50 100,90" fill="white" opacity="0.15"/>

  <!-- Central book icon (simplified, modern) -->
  <g transform="translate(60, 60)">
    <!-- Book spine -->
    <rect x="35" y="10" width="3" height="60" fill="white" opacity="0.5"/>

    <!-- Left page -->
    <path d="M 10 10 L 10 70 Q 15 75 20 75 L 20 10 Z" fill="white" opacity="0.95" stroke="white" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Right page -->
    <path d="M 21 10 L 21 75 Q 26 75 30 70 L 30 10 Z" fill="white" opacity="0.9" stroke="white" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Corner accent (star/sparkle) -->
    <g transform="translate(28, 15)">
      <polygon points="0,-4 1,-1 4,-1 2,1 3,4 0,2 -3,4 -2,1 -4,-1 -1,-1" fill="url(#accent)" opacity="0.85"/>
    </g>

    <!-- Accent line (knowledge flowing) -->
    <line x1="10" y1="25" x2="28" y2="25" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Small geometric shapes (modern tech vibe) -->
  <circle cx="145" cy="60" r="4" fill="white" opacity="0.4"/>
  <circle cx="155" cy="75" r="3" fill="white" opacity="0.3"/>
  <rect x="138" y="135" width="6" height="6" rx="1" fill="white" opacity="0.4"/>
</svg>
