<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>

  <!-- Graduation cap (mortarboard) -->
  <!-- Board top -->
  <polygon points="32,14 54,24 32,34 10,24" fill="#ffffff" opacity="0.95"/>
  <!-- Board shadow underside -->
  <polygon points="32,34 54,24 54,27 32,37" fill="#c4b5fd" opacity="0.6"/>
  <polygon points="32,34 10,24 10,27 32,37" fill="#a5b4fc" opacity="0.4"/>

  <!-- Left tassel string -->
  <line x1="10" y1="24" x2="10" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="10" cy="40" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- Open book below cap -->
  <path d="M20 42 Q32 39 44 42 L44 52 Q32 49 20 52 Z" fill="#ffffff" opacity="0.9"/>
  <line x1="32" y1="39.5" x2="32" y2="52" stroke="#c4b5fd" stroke-width="1.2" stroke-linecap="round"/>
</svg>
