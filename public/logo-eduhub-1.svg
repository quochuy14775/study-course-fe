<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#mainGrad)" opacity="0.1" stroke="url(#mainGrad)" stroke-width="2"/>

  <!-- Main icon circle -->
  <circle cx="100" cy="100" r="85" fill="url(#mainGrad)" filter="url(#shadow)"/>

  <!-- Light reflection -->
  <circle cx="65" cy="65" r="35" fill="white" opacity="0.15"/>

  <!-- Book with pages (stylized) -->
  <g transform="translate(60, 70)">
    <!-- Left page -->
    <path d="M 0 8 L 0 50 Q 5 55 12 55 L 12 8 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Right page -->
    <path d="M 13 8 L 13 55 Q 20 55 25 50 L 25 8 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Book spine -->
    <line x1="0" y1="8" x2="25" y2="8" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
    <!-- Bookmark/ribbon -->
    <line x1="20" y1="6" x2="20" y2="45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Graduation cap accent -->
  <g transform="translate(75, 48)">
    <polygon points="15,0 30,8 15,12 0,8" fill="white" opacity="0.85"/>
    <line x1="0" y1="8" x2="-3" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-3" cy="24" r="2.5" fill="white" opacity="0.8"/>
  </g>
</svg>
